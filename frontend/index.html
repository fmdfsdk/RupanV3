    <!-- Dynamic GTM / GA4 / Pixel Telemetry Preloader -->
    <script>
      (function() {
        try {
          var settingsStr = localStorage.getItem('rup_db_settings');
          if (settingsStr) {
            var settings = JSON.parse(settingsStr);
            var gtmId = settings.google_tag_manager_id || settings.googleTagManagerId;
            var gaId = settings.google_analytics_id || settings.googleAnalyticsId;
            var pixelId = settings.meta_pixel_id || settings.metaPixelId;

            // 1. GTM Inject
            if (gtmId) {
              (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
              new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
              j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
              'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
              })(window,document,'script','dataLayer',gtmId);
              window.isGTMConfigured = true;
            }

            // 2. GA4 Inject
            if (gaId) {
              var gaScript = document.createElement('script');
              gaScript.async = true;
              gaScript.src = 'https://www.googletagmanager.com/gtag/js?id=' + gaId;
              document.head.appendChild(gaScript);

              window.dataLayer = window.dataLayer || [];
              window.gtag = function(){dataLayer.push(arguments);}
              gtag('js', new Date());
              gtag('config', gaId, { 'send_page_view': false });
              window.isGAConfigured = true;
            }

            // 3. Meta Pixel Inject
            if (pixelId) {
              !function(f,b,e,v,n,t,s)
              {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
              n.callMethod.apply(n,arguments):n.queue.push(arguments)};
              if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
              n.queue=[];t=b.createElement(e);t.async=!0;
              t.src=v;s=b.getElementsByTagName(e)[0];
              s.parentNode.insertBefore(t,s)}(window, document,'script',
              'https://connect.facebook.net/en_US/fbevents.js');
              fbq('init', pixelId);
              window.isPixelLoaded = true;
            }
          }
        } catch(e) {
          console.error('[Telemetry Preloader] Error:', e);
        }
      })();
    </script>

  <body>
    <!-- Dynamic GTM Noscript Fallback Preloader -->
    <script>
      (function() {
        try {
          var settingsStr = localStorage.getItem('rup_db_settings');
          if (settingsStr) {
            var settings = JSON.parse(settingsStr);
            var gtmId = settings.google_tag_manager_id || settings.googleTagManagerId;
            if (gtmId) {
              var iframe = document.createElement('iframe');
              iframe.src = 'https://www.googletagmanager.com/ns.html?id=' + gtmId;
              iframe.height = '0';
              iframe.width = '0';
              iframe.style.display = 'none';
              iframe.style.visibility = 'hidden';
              var noscript = document.createElement('noscript');
              noscript.appendChild(iframe);
              document.body.insertBefore(noscript, document.body.firstChild);
            }
          }
        } catch(e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>

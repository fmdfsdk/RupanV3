    <!--
      ================================================================
      TELEMETRY BOOTSTRAP
      ================================================================
      Runs before any JS bundle loads. Reads cached Supabase settings
      from localStorage and injects tracking scripts at the earliest
      possible moment so no events are lost on first load.
      ================================================================
    -->
    <script>
      // ── Step 1: Bootstrap dataLayer + gtag queue (must come before any gtag calls) ──
      window.dataLayer = window.dataLayer || [];
      window.gtag = window.gtag || function () { window.dataLayer.push(arguments); };
      gtag('js', new Date());

      // ── Step 2: Bootstrap Meta Pixel loader (before fbevents.js loads) ──
      !function(f,b,e,v,n,t,s){
        if(f.fbq)return;n=f.fbq=function(){n.callMethod?
        n.callMethod.apply(n,arguments):n.queue.push(arguments)};
        if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
        n.queue=[];t=b.createElement(e);t.async=!0;
        t.src=v;s=b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t,s)
      }(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');

      // ── Step 3: Load settings from localStorage cache and inject trackers ──
      (function () {
        try {
          var raw = localStorage.getItem('rup_db_settings');
          if (!raw) return;

          var s = JSON.parse(raw);
          var gtmId   = s.google_tag_manager_id || s.googleTagManagerId;
          var gaId    = s.google_analytics_id   || s.googleAnalyticsId;
          var pixelId = s.meta_pixel_id          || s.metaPixelId;

          // ── Google Tag Manager ──
          if (gtmId && !window.isGTMConfigured) {
            (function(w,d,l,i){
              w[l]=w[l]||[];
              w[l].push({'gtm.start': new Date().getTime(), event:'gtm.js'});
              var f=d.getElementsByTagName('script')[0],
                  j=d.createElement('script');
              j.async=true;
              j.src='https://www.googletagmanager.com/gtm.js?id='+i;
              f.parentNode.insertBefore(j,f);
            })(window, document, 'dataLayer', gtmId);
            window.isGTMConfigured = true;
          }

          // ── Google Analytics 4 ──
          // IMPORTANT: gtag('config') must be called in the onload handler of
          // the GA script, not before it is loaded. We set a global flag here
          // and let telemetry.ts call gtag('config') on script onload.
          if (gaId && !window.isGAConfigured) {
            var gaScript = document.createElement('script');
            gaScript.async = true;
            gaScript.src = 'https://www.googletagmanager.com/gtag/js?id=' + gaId;
            gaScript.onload = function () {
              gtag('config', gaId, { send_page_view: false });
            };
            document.head.appendChild(gaScript);
            window.isGAConfigured = true;
          }

          // ── Meta Pixel ──
          if (pixelId && !window.isPixelLoaded) {
            fbq('init', pixelId);
            fbq('track', 'PageView');
            window.isPixelLoaded = true;
          }

        } catch (e) {
          console.error('[Telemetry Preloader] Error:', e);
        }
      })();
    </script>

  <body>
    <!--
      GTM Noscript Fallback — must be the FIRST element inside <body>
      Rendered statically here instead of dynamically injected by JS
      so it works even if JS fails to load.
      Replace GTM-XXXXXX with your actual GTM container ID,
      OR this will be injected by the dynamic preloader above.
    -->
    <script>
      // Dynamically inject the GTM noscript iframe if GTM is configured
      (function () {
        try {
          var raw = localStorage.getItem('rup_db_settings');
          if (!raw) return;
          var s = JSON.parse(raw);
          var gtmId = s.google_tag_manager_id || s.googleTagManagerId;
          if (gtmId) {
            var ns = document.createElement('noscript');
            var iframe = document.createElement('iframe');
            iframe.src = 'https://www.googletagmanager.com/ns.html?id=' + gtmId;
            iframe.height = '0';
            iframe.width  = '0';
            iframe.style.cssText = 'display:none;visibility:hidden';
            ns.appendChild(iframe);
            document.body.insertBefore(ns, document.body.firstChild);
          }
        } catch (e) {}
      })();
    </script>
